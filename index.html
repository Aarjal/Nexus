<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexus</title>
  </head>

  <body>
    <header id="head">
      <h1>NEXUS - All in ONE</h1>

      <nav id="top-bar" aria-label="Display settings">
        <button id="theme-toggle" type="button" aria-label="Toggle-theme">
          <i data-lucide="moon"></i>
        </button>
        <button id="settings-button" type="button">
          <i data-lucide="settings"></i>
        </button>
      </nav>
    </header>

    <main>
      <section class="greeting" aria-label="Welcome">
        <p id="greeting-text">Welcome.</p>
        <p id="current-date">Today is October 10.</p>
        <!--- this oct 10 part wil be a different font than the rest and bold -->
      </section>

      <section id="clock" aria-label="Analog clock">
        <div class="analog-clock" role="img" aria-label="Current local time show">
          <span class="clock-number number-12">12</span>
          <span class="clock-number number-1">1</span>
          <span class="clock-number number-2">2</span>
          <span class="clock-number number-3">3</span>
          <span class="clock-number number-4">4</span>
          <span class="clock-number number-5">5</span>
          <span class="clock-number number-6">6</span>
          <span class="clock-number number-7">7</span>
          <span class="clock-number number-8">8</span>
          <span class="clock-number number-9">9</span>
          <span class="clock-number number-10">10</span>
          <span class="clock-number number-11">11</span>

          <div class="clock-hand hour-hand"></div>
          <div class="clock-hand minute-hand"></div>
          <div class="clock-hand second-hand"></div>
          <div class="clock-center"></div>
        </div>
        <p id="time-lebel">Time remaining today : calculating...</p>
      </section>

      <section class="shortcuts" aria-labelledby="shortcuts-title">
        <h3 id="shortcuts-title">Your shortcuts</h3>
        <div id="shortcut-list">
          <button id="add-shortcut" type="button" aria-label="Add Shortcut">+</button>
          <p class="empty-state">Your shortcuts will appear here.</p>
        </div>
        <form id="shortcut-form" hidden>
          <label for="shortcut-name">Website name</label>
          <input id="shortcut-name" name="name" type="text" placeholder="Github" required />
          
          <label for="shortcut-url">Website URL</label>
          <input id="shortcut-url" name="url" type="url" placeholder="https://github.com" required />

          <button type="submit">Add shortcut</button>
          <button id="cancel-shortcut" type="button">Cancel</button>
        </form>
      </section>

      <section class="workspace" aria-labelledby="workspace-title">
        <h3 id="workspace-title">Your Workspace</h3>
        <div id="daily-task">
          <h4>Today's focus</h4>
          <form id="task-form">
            <input id="task-input" type="text" placeholder="Get it done.." aria-label="New task" required/>
            <button type="submit">Add task</button>
          </form>
          <ul id="task-list"></ul>
        </div>
        <div id="focus-timer">
          <h4>Focus timer</h4>
          <p id="timer-display" role="timer" aria-live="off">25:00</p>
          <div id="timer-controls">
          <button id="timer-start" type="button">Start</button>
          <button id="timer-reset" type="button">Reset</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
